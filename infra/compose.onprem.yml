# KANAP on-premise: the API and the web server run the published images of one version, the
# version of this checkout. To run another one (an update, a rollback), check out its tag
# (git checkout v26.10.9), then pull: this file and the images stay in step. Compose does not read
# ../.env for the ${...} of this file, so KANAP_VERSION there would change nothing. Between two
# versions, `main` still names the latest published version: to run the code of `main`, build it
# yourself with compose.onprem.build.yml
# (docker compose -f infra/compose.onprem.yml -f infra/compose.onprem.build.yml build).

services:
  api:
    image: ghcr.io/kanap-hq/kanap-api:${KANAP_VERSION:-26.10.8}
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Your internal certificate authority, for SMTP, PostgreSQL or S3 over TLS (see certs/README.md).
    # Nothing changes while NODE_EXTRA_CA_CERTS in ../.env names no file of this directory.
    volumes:
      - ./certs:/etc/kanap/certs:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Default CMD runs migrations then starts the API
    # The entrypoint retries the database connection only (not ready, or lost mid-migration): a
    # migration that fails on its own exits at once (code 1) with its message, the database left
    # as before; restart policy then applies.
    # Stop: SIGTERM reaches node (init + exec CMD), which finishes the requests in flight
    # (SHUTDOWN_DRAIN_TIMEOUT_MS, default 20 s) before it exits; the kill comes after 30 s.
    init: true
    stop_grace_period: 30s
    # Health: "docker ps" shows healthy once GET /health answers. The first start runs the
    # migrations, hence the long start period. Status only: Docker restarts nothing on it.
    # "-Y off": the probe calls the container directly, even when http_proxy is set.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # The API runs as the "node" user on port 8080 and needs no Linux capability.
    cap_drop:
      - ALL
    # Capacity, set in ../.env (see .env.onprem.example and the operations guide):
    #   API_WORKERS   API processes in this container (default 1). Each adds about 200 MB (up to 300 MB under load)
    #                 of memory and up to DB_POOL_MAX database connections.
    #   DB_POOL_MAX   database connections per process (default 20). Workers × pool must stay
    #                 under PostgreSQL's max_connections minus about 15; the API warns at start.

  web:
    image: ghcr.io/kanap-hq/kanap-web:${KANAP_VERSION:-26.10.8}
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves the built SPA and proxies /api to api:8080
    # Health: "docker ps" shows healthy once nginx answers on /. "-Y off" as for the API.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # nginx starts as root, then runs its workers as the "nginx" user: it needs to hand its
    # cache directories over (CHOWN) and to switch user (SETUID, SETGID). NET_BIND_SERVICE
    # covers engines that keep port 80 reserved to privileged processes.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  # Maintenance commands (TypeORM CLI, scripts), never started by `up`. The image is the full
  # tree of the same version; the command given to `run` replaces its default start-up command:
  #   docker compose -f infra/compose.onprem.yml run --rm tools npm run typeorm -- migration:show
  tools:
    profiles: ["tools"]
    image: ghcr.io/kanap-hq/kanap-api-tools:${KANAP_VERSION:-26.10.8}
    env_file: ../.env
    environment:
      # No update check of npm: no call to registry.npmjs.org, no "new version of npm" notice.
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certs:/etc/kanap/certs:ro
    restart: "no"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    cap_drop:
      - ALL
