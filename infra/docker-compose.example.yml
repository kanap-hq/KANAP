# DEVELOPMENT ONLY. Do not use this file for a server installation.
# It runs the API in watch mode from its sources, a PostgreSQL superuser with a public
# password and fixed test credentials. Servers use compose.onprem.yml (on-premise) or
# compose.prod.yml / compose.qa.yml.
#
# Copy it to infra/docker-compose.yml (ignored by git) for the local stack. Published ports
# listen on 127.0.0.1 only. To reach them from another machine or a VM (for example the nested
# Windows setup below), set KANAP_DEV_BIND=0.0.0.0 in the shell or in infra/.env.
# PostgreSQL stays on 127.0.0.1 whatever KANAP_DEV_BIND says; KANAP_DEV_DB_BIND changes it.
#
# Images are pinned to the digest of their multi-architecture index, taken on 2026-10-09.
name: cio
services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      # Note: Using default 'postgres' superuser, 'app' user created via init script
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    ports:
      - "${KANAP_DEV_DB_BIND:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ../backend
      dockerfile: Dockerfile
      # The development stage (sources and tools for `npm run start:dev`). Servers build the
      # runtime stage, the default.
      target: dev
    depends_on:
      db:
        condition: service_healthy
    # Local dev config (untracked)
    env_file:
      - ../backend/env.dev
    # Nested Windows-on-Linux dev: expose the outer Linux host gateway to the API
    # container. Override KANAP_LINUX_HOST_GATEWAY if the VM gateway changes.
    extra_hosts:
      - "linux.host.internal:${KANAP_LINUX_HOST_GATEWAY:-172.20.0.1}"
    ports:
      - "${KANAP_DEV_BIND:-127.0.0.1}:8080:8080"
    command: ["sh","-lc","npm run typeorm -- migration:run && npm run start:dev"]

  web:
    restart: unless-stopped
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    depends_on:
      - api
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_MARKETING_URL: http://localhost:8082
    ports:
      - "${KANAP_DEV_BIND:-127.0.0.1}:5173:5173"
    command: ["npm","run","dev","--","--host"]

  marketing:
    restart: unless-stopped
    build:
      context: ../marketing
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "${KANAP_DEV_BIND:-127.0.0.1}:8082:80"
    # static site served by nginx within the container
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Optional dev proxy to test subdomains with lvh.me
  nginx:
    restart: unless-stopped
    image: nginx:alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    profiles: ["dev-proxy"]
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
      marketing:
        condition: service_healthy
    ports:
      - "${KANAP_DEV_BIND:-127.0.0.1}:80:80"
    volumes:
      - ./nginx/dev/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ── Netbox test inventory (profile "netbox") ───────────────────────────────
  # Opt-in only: `docker compose -f infra/docker-compose.yml --profile netbox up -d netbox`.
  # Every credential below is a throwaway DEV-ONLY value. Never reuse anywhere else.
  # The api container reaches this instance at http://netbox:8080 on the default
  # compose network. From the host it is http://localhost:8084.
  netbox:
    image: netboxcommunity/netbox:v4.7.1@sha256:59e3e5954d0243d8648f2fa7ba82cf7c7770aaeef392026cca8b21cd67411e74
    profiles: ["netbox"]
    restart: unless-stopped
    user: "netbox:root"
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-redis:
        condition: service_healthy
    environment:
      # DEV-ONLY credentials
      SECRET_KEY: "kanap-dev-netbox-secret-key-do-not-reuse-0123456789abcdef"
      # Netbox requires at least 50 characters for the pepper and the secret key.
      API_TOKEN_PEPPER_1: "kanap-dev-netbox-api-token-pepper-do-not-reuse-0123456789abcdef"
      SUPERUSER_NAME: "admin"
      SUPERUSER_EMAIL: "admin@kanap.local"
      SUPERUSER_PASSWORD: "netboxdev"
      # v2 token: key is 12 chars, secret is 40 chars. Clients send
      # `Authorization: Token nbt_<SUPERUSER_API_KEY>.<SUPERUSER_API_TOKEN>`.
      SUPERUSER_API_KEY: "kanapdevkey1"
      SUPERUSER_API_TOKEN: "kanapdevnetboxtoken0123456789abcdefghijk"
      SKIP_SUPERUSER: "false"
      ALLOWED_HOSTS: "netbox localhost 127.0.0.1 host.docker.internal"
      DB_HOST: netbox-postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: netbox-redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: netbox
      REDIS_SSL: "false"
      REDIS_CACHE_HOST: netbox-redis
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_DATABASE: "1"
      REDIS_CACHE_PASSWORD: netbox
      REDIS_CACHE_SSL: "false"
      # Allow duplicate IP addresses in the global table, so the fixture can
      # exercise the duplicate-IP case.
      ENFORCE_GLOBAL_UNIQUE: "false"
      GRAPHQL_ENABLED: "false"
      METRICS_ENABLED: "false"
      RELEASE_CHECK_URL: ""
    ports:
      - "${KANAP_DEV_BIND:-127.0.0.1}:8084:8080"
    volumes:
      - netbox-media:/opt/netbox/netbox/media
    healthcheck:
      test: ["CMD", "/opt/netbox/health.sh"]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 40

  netbox-postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    profiles: ["netbox"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    volumes:
      - netbox-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d netbox -U netbox"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  netbox-redis:
    image: valkey/valkey:9.1-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    profiles: ["netbox"]
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "netbox"]
    volumes:
      - netbox-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(valkey-cli --pass netbox ping)\" = 'PONG' ]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  db-data:
  netbox-db-data:
  netbox-redis-data:
  netbox-media:
