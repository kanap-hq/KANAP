# The images are the published ones: ghcr.io/kanap-hq/kanap-api, kanap-web and kanap-marketing.
# ${VAR} interpolation in this file comes from the Compose project env file passed on the
# command line:
#   docker compose --env-file backend/.env.prod -f infra/compose.prod.yml ...
# (a top-level env_file: key is not part of the Compose spec). The api and web services still
# load their own env files at runtime via env_file.
# KANAP_VERSION (default: the version of this checkout) names the version of the three images.
# KANAP_MARKETING_VERSION overrides it for the public site, which is also published from main
# between two versions: KANAP_MARKETING_VERSION=main-<short sha>.

services:
  api:
    image: ghcr.io/kanap-hq/kanap-api:${KANAP_VERSION:-26.10.8}
    env_file: ../backend/.env.prod
    environment:
      INTEGRATED_DOCS_AUTO_ROLLOUT: ${INTEGRATED_DOCS_AUTO_ROLLOUT:-if-needed}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-enforce}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Default CMD runs migrations then starts API
    # The entrypoint retries the database connection only (not ready, or lost mid-migration): a
    # migration that fails on its own exits at once (code 1) with its message, the database left
    # as before; restart policy then applies.
    # Stop: SIGTERM reaches node (init + exec CMD), which finishes the requests in flight
    # (SHUTDOWN_DRAIN_TIMEOUT_MS, default 20 s) before it exits; the kill comes after 30 s.
    init: true
    stop_grace_period: 30s
    # Health: "docker ps" shows healthy once GET /health answers. The first start runs the
    # migrations, hence the long start period. Status only: Docker restarts nothing on it.
    # "-Y off": the probe calls the container directly, even when http_proxy is set.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # The API runs as the "node" user on port 8080 and needs no Linux capability.
    cap_drop:
      - ALL
    # API processes: API_WORKERS in backend/.env.<env> (default 1, unset here on purpose). Each
    # process adds about 150 to 500 MB and DB_POOL_MAX connections: QA has 3.8 GB and no swap,
    # keep 1 there. See doc/architecture.md, "Several API processes".

  web:
    image: ghcr.io/kanap-hq/kanap-web:${KANAP_VERSION:-26.10.8}
    env_file: ../frontend/.env.prod
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves SPA; proxy /api to api service
    # Health: "docker ps" shows healthy once nginx answers on /. "-Y off" as for the API.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # nginx starts as root, then runs its workers as the "nginx" user: it needs to hand its
    # cache directories over (CHOWN) and to switch user (SETUID, SETGID). NET_BIND_SERVICE
    # covers engines that keep port 80 reserved to privileged processes.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  marketing:
    image: ghcr.io/kanap-hq/kanap-marketing:${KANAP_MARKETING_VERSION:-${KANAP_VERSION:-26.10.8}}
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
