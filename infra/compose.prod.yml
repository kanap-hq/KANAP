# ${VAR} interpolation in this file (e.g. web build.args.VITE_API_URL)
# comes from the Compose project env file passed on the command line:
#   docker compose --env-file backend/.env.prod -f infra/compose.prod.yml ...
# (a top-level env_file: key is not part of the Compose spec). The api
# service still loads backend/.env.prod at runtime via its own env_file.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file: ../backend/.env.prod
    environment:
      INTEGRATED_DOCS_AUTO_ROLLOUT: ${INTEGRATED_DOCS_AUTO_ROLLOUT:-if-needed}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-enforce}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Default CMD runs migrations then starts API
    # Stop: SIGTERM reaches node (init + exec CMD), which finishes the requests in flight
    # (SHUTDOWN_DRAIN_TIMEOUT_MS, default 20 s) before it exits; the kill comes after 30 s.
    init: true
    stop_grace_period: 30s
    # API processes: API_WORKERS in backend/.env.<env> (default 1, unset here on purpose). Each
    # process adds about 150 to 500 MB and DB_POOL_MAX connections: QA has 3.8 GB and no swap,
    # keep 1 there. See doc/architecture.md, "Several API processes".

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    env_file: ../frontend/.env.prod
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves SPA; proxy /api to api service

  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
