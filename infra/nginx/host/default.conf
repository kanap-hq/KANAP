# Host Nginx default server, the same on QA and prod.
# Deploy to /etc/nginx/sites-available/00-default and link it from sites-enabled; remove the
# distribution's `default` link from sites-enabled (keep its file, the package owns it).
#
# A request whose name no other server block declares (an unknown name, the bare address, an
# old domain) gets no answer: the TLS handshake is refused, or the connection is closed (444).
# Every name the server serves must be declared in qa.conf / prod.conf before this file is
# enabled, or that name stops being served.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    # No certificate: a client naming an unknown host (or no host) never completes the handshake.
    ssl_reject_handshake on;

    # A known name in the handshake but an unknown Host header lands here too: close it.
    return 444;
}
