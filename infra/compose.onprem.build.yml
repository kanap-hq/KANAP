# Builds the images on this machine instead of pulling the published ones. Use it on top of
# compose.onprem.yml, for a fork, a local fix, a host without access to ghcr.io, or an API on
# another host (VITE_API_URL, baked into the web image when it is built; Compose takes it from
# the shell, not from ../.env: VITE_API_URL=https://api.example.org docker compose ... build web):
#   docker compose -f infra/compose.onprem.yml -f infra/compose.onprem.build.yml build
#   docker compose -f infra/compose.onprem.yml -f infra/compose.onprem.build.yml up -d
# A locally built image is named *:local, never like a published one.

services:
  api:
    image: kanap-api:local
    build:
      context: ../backend
      dockerfile: Dockerfile
      # The user manual's pages, for the assistant (backend/Dockerfile, stage help-docs).
      additional_contexts:
        help-docs: ../doc/help/docs
      # The runtime stage: compiled code and production dependencies only.
      target: runtime

  web:
    image: kanap-web:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}

  tools:
    image: kanap-api-tools:local
    build:
      context: ../backend
      dockerfile: Dockerfile
      # The user manual's pages, for the assistant (backend/Dockerfile, stage help-docs).
      additional_contexts:
        help-docs: ../doc/help/docs
      # The dev stage: the full tree, for maintenance commands.
      target: dev
