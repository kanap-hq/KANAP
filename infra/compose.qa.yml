# ${VAR} interpolation in this file (e.g. web build.args.VITE_API_URL)
# comes from the Compose project env file passed on the command line:
#   docker compose --env-file backend/.env.qa -f infra/compose.qa.yml ...
# (a top-level env_file: key is not part of the Compose spec). The api
# service still loads backend/.env.qa at runtime via its own env_file.

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # The runtime stage: compiled code and production dependencies only.
      target: runtime
    env_file: ../backend/.env.qa
    environment:
      INTEGRATED_DOCS_AUTO_ROLLOUT: ${INTEGRATED_DOCS_AUTO_ROLLOUT:-if-needed}
      CAPTCHA_MODE: ${CAPTCHA_MODE:-enforce}
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    # Use image default CMD → runs migrations then starts the API
    # The entrypoint retries the database connection only (not ready, or lost mid-migration): a
    # migration that fails on its own exits at once (code 1) with its message, the database left
    # as before; restart policy then applies.
    # Stop: SIGTERM reaches node (init + exec CMD), which finishes the requests in flight
    # (SHUTDOWN_DRAIN_TIMEOUT_MS, default 20 s) before it exits; the kill comes after 30 s.
    init: true
    stop_grace_period: 30s
    # Health: "docker ps" shows healthy once GET /health answers. The first start runs the
    # migrations, hence the long start period. Status only: Docker restarts nothing on it.
    # "-Y off": the probe calls the container directly, even when http_proxy is set.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # The API runs as the "node" user on port 8080 and needs no Linux capability.
    cap_drop:
      - ALL
    # API processes: API_WORKERS in backend/.env.<env> (default 1, unset here on purpose). Each
    # process adds about 150 to 500 MB and DB_POOL_MAX connections: QA has 3.8 GB and no swap,
    # keep 1 there. See doc/architecture.md, "Several API processes".

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    env_file: ../frontend/.env.qa
    depends_on:
      - api
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    # nginx serves the built SPA and proxies /api to api:8080
    # Health: "docker ps" shows healthy once nginx answers on /. "-Y off" as for the API.
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
    # nginx starts as root, then runs its workers as the "nginx" user: it needs to hand its
    # cache directories over (CHOWN) and to switch user (SETUID, SETGID). NET_BIND_SERVICE
    # covers engines that keep port 80 reserved to privileged processes.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped
    # Docker logs of this container: at most 5 files of 10 MB, whatever the daemon's default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024
