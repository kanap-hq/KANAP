server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;
  # The origin listens on HTTP behind Cloudflare: keep redirect Locations relative,
  # otherwise nginx turns `return 301 /offer` into http://kanap.net/offer.
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.googletagmanager.com https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com https://www.google-analytics.com https://region1.google-analytics.com https://cloudflareinsights.com; frame-src https://challenges.cloudflare.com" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # Long cache for fingerprinted assets
  location /_astro/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Short cache for public assets (logos, favicons, images)
  location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
  }

  # Clean URLs: /features/budget → /features/budget/index.html
  # Unknown paths fall through to the custom 404 page (not a SPA fallback)
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Local/container fallback: host nginx normally handles /api before this container.
  location = /api { return 301 /api/; }

  location ^~ /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Host    $host;
  }

  # Serve generated sitemap index / sitemaps / robots.txt at root
  location = /robots.txt      { access_log off; try_files $uri =404; }
  location = /sitemap-index.xml { access_log off; try_files $uri =404; }
  location ~ ^/sitemap-\d+\.xml$ { access_log off; try_files $uri =404; }
  # Astro emits sitemap-index.xml; crawlers often request /sitemap.xml.
  # Absolute https Location: origin listens on HTTP behind Cloudflare, so a
  # relative 301 becomes http://… and GSC rejects the old sitemap fetch.
  location = /sitemap.xml { return 301 https://kanap.net/sitemap-index.xml; }

  # Legacy .html URLs from the previous site — 301 to the new clean URLs
  location = /index.html                  { return 301 /; }
  location = /offer.html                  { return 301 /offer; }
  location = /faq.html                    { return 301 /faq; }
  location = /contact.html                { return 301 /contact; }
  location = /privacy.html                { return 301 /privacy; }
  location = /terms.html                  { return 301 /terms; }
  location = /sales.html                  { return 301 /sales; }
  location = /legal.html                  { return 301 /legal; }
  location = /activate.html               { return 301 /trial/activate; }
  location = /features/                   { return 301 /features; }
  location = /features/index.html         { return 301 /features; }
  location = /features/budget.html        { return 301 /features/budget; }
  location = /features/portfolio.html     { return 301 /features/portfolio; }
  location = /features/knowledge.html     { return 301 /features/knowledge; }
  location = /features/ai.html            { return 301 /features/ai; }
  # IT Ops page renamed to IT Landscape
  location = /features/it-ops.html        { return 301 /features/it-landscape; }
  location = /features/it-ops             { return 301 /features/it-landscape; }
  location = /features/it-ops/            { return 301 /features/it-landscape; }
  # Obsolete comparison page
  location = /features/comparison.html    { return 301 /features; }

  # Custom 404 page (Astro builds dist/404.html from src/pages/404.astro)
  error_page 404 /404.html;
  location = /404.html { internal; }

  # gzip (brotli handled upstream if configured)
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;
}
