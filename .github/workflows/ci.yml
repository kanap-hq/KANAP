name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    # `edited` covers a base-branch change: a stacked PR retargeted to main after its base
    # merged gets no `synchronize`, so without it the required checks never run.
    types: [ opened, synchronize, reopened, edited ]
  # The merge queue tests each queued pull request on top of main and the pull requests ahead
  # of it, and merges it only when the required checks pass on that combination.
  merge_group:

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lists the files a pull request changes and decides which of the jobs below it can affect
  # (.github/scripts/ci-changes.sh): the three required ones and `images`. A skipped job
  # reports its required check as passed. Every job runs for a push on main and in the merge
  # queue.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      onprem: ${{ steps.decide.outputs.onprem }}
      images: ${{ steps.decide.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so `git diff` can find the merge base of the pull request.
          fetch-depth: 0
      - name: Decide which jobs run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            bash .github/scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA"
          else
            bash .github/scripts/ci-changes.sh all
          fi

  # Each job below fails open: when `changes` did not succeed, the job runs.
  backend:
    name: backend (cloud)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/appdb
      # Database lanes of the runner: each runs its specs on its own copy of appdb.
      DB_LANES: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      # Type-checks the sources, the specs and the database scripts, and emits them once
      # into ci-dist/ for the steps below. The production build (`npm run build`) is
      # checked by the `build (onprem)` job.
      - name: Type-check and compile backend sources and specs
        run: npm run build:ci
      - name: Prepare CI PostgreSQL role/database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE appdb OWNER app;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO app;"
      - name: Prepare backend database
        run: npx typeorm migration:run -d ci-dist/backend/src/data-source.js
      # One copy of the migrated database per lane (appdb_1 ... appdb_N), owned by app: RLS
      # and its FORCE policies come with the copy. A copy needs a template with no open
      # connection, so it runs after the migrations and before any spec.
      - name: Copy the database for the parallel lanes
        env:
          PGPASSWORD: postgres
        run: |
          for n in $(seq 1 "$DB_LANES"); do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE appdb_$n TEMPLATE appdb OWNER app;"
          done
      - name: Run backend hardening checks
        run: node scripts/run-ci-tests.js --no-compile --db-lanes "$DB_LANES"

  # The frontend check runs as one build job and three test shards in parallel; the
  # `frontend (cloud)` job below gathers their results into the required check.
  frontend-build:
    name: frontend build
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build

  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    strategy:
      # Every shard finishes, so one run lists every failing test.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Vitest splits the test files by a hash of their path: each file runs in exactly one shard.
      - name: Run frontend tests (shard ${{ matrix.shard }} of 3)
        run: npm test -- --shard=${{ matrix.shard }}/3

  # The required check. It always runs, even when the run is cancelled, so it never reports a
  # skip (which would count as passed) for a frontend change whose build or tests did not pass.
  frontend:
    name: frontend (cloud)
    needs: [ changes, frontend-build, frontend-tests ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the frontend build and tests
        env:
          CHANGES: ${{ needs.changes.result }}
          AFFECTED: ${{ needs.changes.outputs.frontend }}
          BUILD: ${{ needs.frontend-build.result }}
          TESTS: ${{ needs.frontend-tests.result }}
        run: |
          echo "changes=$CHANGES frontend affected=$AFFECTED build=$BUILD tests=$TESTS"
          if [ "$CHANGES" = success ] && [ "$AFFECTED" = false ]; then
            echo "This pull request does not change the frontend: nothing to check."
            exit 0
          fi
          if [ "$BUILD" = success ] && [ "$TESTS" = success ]; then
            echo "Frontend build and every test shard passed."
            exit 0
          fi
          echo "::error::Frontend build or tests did not pass (build=$BUILD, tests=$TESTS)."
          exit 1

  onprem:
    name: build (onprem)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.onprem == 'true') }}
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_MODE: single-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Every lockfile entry carries an integrity hash (backend, frontend, marketing).
      - name: Check lockfile integrity hashes
        run: bash .github/scripts/check-lockfile-integrity.sh
      - name: Build backend (onprem)
        working-directory: backend
        run: npm ci && npm run build
      - name: Build frontend (onprem)
        working-directory: frontend
        run: npm ci && npm run build

  # Builds the images the servers run (API runtime stage, web, marketing) and the API dev stage,
  # and checks the compose files and the base image pins. It runs when a file that goes into an
  # image or a compose file changes (rules in .github/scripts/ci-changes.sh), and on every push
  # on main and in the merge queue. Not a required check yet: the maintainer adds it to the required checks after a week
  # of runs.
  images:
    name: images
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.images == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # The env files the compose files load are not in git: the on-premise example stands in
      # for ../.env (it also proves the example is accepted), empty files for the others.
      - name: Check the compose files
        run: |
          cp infra/.env.onprem.example .env
          touch backend/.env.qa frontend/.env.qa backend/.env.prod frontend/.env.prod backend/env.dev
          docker compose -f infra/compose.onprem.yml config -q
          docker compose --env-file backend/.env.qa -f infra/compose.qa.yml config -q
          docker compose --env-file backend/.env.prod -f infra/compose.prod.yml config -q
          docker compose -f infra/docker-compose.example.yml config -q
      - name: Check the base image pins (multi-architecture index digests)
        run: bash .github/scripts/check-image-pins.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the API image (runtime stage)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          tags: kanap-api:ci
          load: true
          cache-from: type=gha,scope=api-runtime
          cache-to: type=gha,mode=max,scope=api-runtime
      - name: Check the API image (converters, no sources or development tools)
        run: |
          docker run --rm kanap-api:ci sh -c 'node -v && inkscape --version && pandoc --version | head -1 && typst --version && test ! -e src && test ! -e node_modules/ts-node-dev && test -f dist/knowledge/scripts/backfill-integrated-docs.js'
          docker image ls kanap-api:ci
      - name: Build the API image (dev stage)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: dev
          cache-from: |
            type=gha,scope=api-runtime
            type=gha,scope=api-dev
          cache-to: type=gha,mode=max,scope=api-dev
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Build the marketing image
        uses: docker/build-push-action@v6
        with:
          context: marketing
          cache-from: type=gha,scope=marketing
          cache-to: type=gha,mode=max,scope=marketing
