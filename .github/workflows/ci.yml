name: CI

# CI runs in the merge queue only. The queue builds one pull request at a time, on top of main
# and the pull requests ahead of it, and merges it only when the required checks
# (`backend (cloud)`, `frontend (cloud)`, `build (onprem)`) pass on that combination. On a pull
# request those jobs are skipped, which reports them as passed within seconds, so the pull
# request can enter the queue right away; only the stack order warning runs there. A push on
# main runs nothing: main only receives what the queue has tested. The weekly schedule and a
# manual run on main only rebuild the images to refresh their cache (see the `images` job).
on:
  pull_request:
    branches: [ main ]
  merge_group:
  schedule:
    - cron: '17 4 * * 1' # Mondays, 04:17 UTC
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The token of every job reads the repository only; a job that needs more says so itself.
# Actions are pinned to the full commit SHA of a release, its version in the comment
# (Dependabot updates both). Each job's timeout-minutes is about three times its usual duration
# (3 minutes at least), so a stuck job fails and frees the queue before its 30-minute limit.
# The backend job (about 12 minutes) stays under the limit at 28 minutes instead of three times.
permissions:
  contents: read

jobs:
  # Warns on a pull request that contains the commits of another pull request still open
  # (.github/scripts/stack-order.sh). Nothing depends on it, so it never delays the required
  # checks of the pull request.
  stack-order-pr:
    name: stack order (pull request)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, so git can tell whether one pull request head contains another.
          fetch-depth: 0
      - name: Warn when an open pull request below this one is not merged yet
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/stack-order.sh pull-request "$PR_NUMBER" "$PR_BASE"

  # Refuses, in the merge queue, a pull request that contains the commits of another pull
  # request still open and not ahead of it in the queue. It is not a required check itself:
  # `frontend (cloud)` fails when it did not succeed, so its failure blocks the merge without a
  # change to the repository settings.
  stack-order:
    name: stack order
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check that no open pull request below this one waits behind it
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: bash .github/scripts/stack-order.sh merge-group "$QUEUE_REF" "$QUEUE_BASE"

  # Runs every spec when the changes reach the backend, only the specs that read the user manual
  # when the manual alone changed, and is skipped otherwise (see `changes`).
  backend:
    name: backend (cloud)
    needs: changes
    # Runs even when `changes` failed: with no answer from it, every spec runs.
    if: ${{ !cancelled() && github.event_name == 'merge_group' && needs.changes.outputs.backend != 'none' }}
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgres://app:app@127.0.0.1:5432/appdb
      # Superuser connection of the data-access specs that change the limited role or run its script.
      DATA_ACCESS_ADMIN_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      # Database lanes of the runner: each runs its specs on its own copy of appdb.
      DB_LANES: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      # Type-checks the sources, the specs and the database scripts, and emits them once
      # into ci-dist/ for the steps below. The production build (`npm run build`) is
      # checked by the `build (onprem)` job.
      - name: Type-check and compile backend sources and specs
        run: npm run build:ci
      - name: Prepare CI PostgreSQL role/database
        if: ${{ needs.changes.outputs.backend != 'docs' }}
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE appdb OWNER app;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS citext;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -c "GRANT ALL ON SCHEMA public TO app;"
      # Data-scoped access: the limited role, before the migrations (they give it its rights in
      # appdb). The lane copies made from appdb keep them.
      - name: Install the data-access role
        if: ${{ needs.changes.outputs.backend != 'docs' }}
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d appdb -v ON_ERROR_STOP=1 -v app_role=app -v mode=install -f ../infra/scripts/data-access-role.sql
      - name: Prepare backend database
        if: ${{ needs.changes.outputs.backend != 'docs' }}
        run: npx typeorm migration:run -d ci-dist/backend/src/data-source.js
      # One copy of the migrated database per lane (appdb_1 ... appdb_N), owned by app: RLS
      # and its FORCE policies come with the copy. A copy needs a template with no open
      # connection, so it runs after the migrations and before any spec.
      - name: Copy the database for the parallel lanes
        if: ${{ needs.changes.outputs.backend != 'docs' }}
        env:
          PGPASSWORD: postgres
        run: |
          for n in $(seq 1 "$DB_LANES"); do
            psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE appdb_$n TEMPLATE appdb OWNER app;"
          done
      - name: Run backend hardening checks
        if: ${{ needs.changes.outputs.backend != 'docs' }}
        run: node scripts/run-ci-tests.js --no-compile --db-lanes "$DB_LANES"
      - name: Run the specs that read the user manual
        if: ${{ needs.changes.outputs.backend == 'docs' }}
        run: |
          for spec in markdown-size markdown-worker admin-password-policy; do
            echo "── src/common/__tests__/$spec.spec.ts"
            node --enable-source-maps "ci-dist/backend/src/common/__tests__/$spec.spec.js"
          done

  # The frontend check runs as one build job and three test shards in parallel; the
  # `frontend (cloud)` job below gathers their results into the required check. Both wait for
  # `stack order` and are skipped when it fails, so a stacking problem fails the run at once.
  frontend-build:
    name: frontend build
    needs: [ stack-order, changes ]
    if: ${{ github.event_name == 'merge_group' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: npm ci && npm run build

  frontend-tests:
    name: frontend tests (${{ matrix.shard }}/3)
    needs: [ stack-order, changes ]
    if: ${{ github.event_name == 'merge_group' && needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      # Every shard finishes, so one run lists every failing test.
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3 ]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      # Vitest splits the test files by a hash of their path: each file runs in exactly one shard.
      - name: Run frontend tests (shard ${{ matrix.shard }} of 3)
        run: npm test -- --shard=${{ matrix.shard }}/3

  # The required check. In the merge queue it always runs, even when the run is cancelled, so
  # it never reports a skip (which would count as passed) when the stack order check, the build
  # or the tests did not pass. It passes without them only when `changes` says the queued
  # changes do not reach the frontend.
  frontend:
    name: frontend (cloud)
    needs: [ stack-order, changes, frontend-build, frontend-tests ]
    if: ${{ always() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check the stack order, the frontend build and the tests
        env:
          STACK_ORDER: ${{ needs.stack-order.result }}
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.frontend }}
          BUILD: ${{ needs.frontend-build.result }}
          TESTS: ${{ needs.frontend-tests.result }}
        run: |
          echo "stack order=$STACK_ORDER build=$BUILD tests=$TESTS"
          if [ "$STACK_ORDER" != success ]; then
            echo "::error::The stack order check did not pass (result: $STACK_ORDER): see the stack order job."
            exit 1
          fi
          if [ "$CHANGES" != success ]; then
            echo "::error::The changed files job did not pass (result: $CHANGES)."
            exit 1
          fi
          if [ "$NEEDED" != true ] && [ "$BUILD" = skipped ] && [ "$TESTS" = skipped ]; then
            echo "The queued changes do not reach the frontend: build and tests skipped."
            exit 0
          fi
          if [ "$BUILD" = success ] && [ "$TESTS" = success ]; then
            echo "Frontend build and every test shard passed."
            exit 0
          fi
          echo "::error::Frontend build or tests did not pass (build=$BUILD, tests=$TESTS)."
          exit 1

  # The script checks always run; the two builds run when the changes reach the backend or the
  # frontend (see `changes`).
  onprem:
    name: build (onprem)
    needs: changes
    # Runs even when `changes` failed: with no answer from it, both builds run.
    if: ${{ !cancelled() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOYMENT_MODE: single-tenant
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # Every lockfile entry carries an integrity hash (backend, frontend, marketing).
      - name: Check lockfile integrity hashes
        run: bash .github/scripts/check-lockfile-integrity.sh
      # Production dependencies of backend, frontend and marketing: no GPL, AGPL or SSPL license
      # and no missing or unreadable one, except the written exceptions
      # (scripts/sbom/license-exceptions.json). Reads the lockfiles only, no network.
      - name: Check the licenses of the production dependencies
        run: |
          node --test scripts/sbom/__tests__/*.test.mjs
          node --test scripts/release/__tests__/*.test.mjs
          node scripts/sbom/check-licenses.mjs
      # The script that queues the ready pull requests (auto-queue.yml) and the form of the docs
      # translation manifest that keeps neighbouring updates mergeable.
      - name: Test the queueing script and the docs translation manifest
        run: |
          node --test .github/scripts/__tests__/*.test.mjs
          node --test scripts/docs/__tests__/*.test.mjs
      - name: Build backend (onprem)
        if: ${{ needs.changes.outputs.builds != 'false' }}
        working-directory: backend
        run: npm ci && npm run build
      - name: Build frontend (onprem)
        if: ${{ needs.changes.outputs.builds != 'false' }}
        working-directory: frontend
        run: npm ci && npm run build

  # Decides, in the merge queue, which checks the queued changes need, from the files they touch
  # (base of the queue group to its head). When the files cannot be listed, everything runs.
  #   backend:  full  backend/, the frontend modules the backend specs import, infra/, a
  #                   Dockerfile, .github/;
  #             docs  otherwise, when the user manual (doc/help/docs/) changed: only the specs
  #                   that read it;
  #             none  otherwise.
  #   frontend: true  frontend/, backend/fixtures/ (read by a frontend test), .github/.
  #   builds:   true  when backend is full or frontend is true (the on-premise builds).
  #   images:   true  a Dockerfile or .dockerignore, infra/, frontend/nginx/,
  #                   marketing/web/nginx.conf, a package.json or lockfile, the API tsconfig
  #                   files, start-up script and script helpers, or .github/.
  # A required job that is not needed is skipped, which GitHub counts as passed.
  changes:
    name: changed files
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      builds: ${{ steps.decide.outputs.builds }}
      images: ${{ steps.decide.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Decide which checks run
        id: decide
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: bash .github/scripts/ci-changes.sh "$BASE_SHA" "$HEAD_SHA" >>"$GITHUB_OUTPUT"

  # Builds the images the servers run (API runtime stage, web, marketing) and the API dev stage,
  # and checks the compose files and the base image pins. In the merge queue it runs when
  # `changed files` finds a change that reaches the images, and only reads the BuildKit cache: a
  # cache written on a queue branch could not be read by any later run. The weekly schedule and
  # a manual run on main build everything and write the cache, in the scope of main that queue
  # runs read. Not a required check yet: the maintainer adds it to the required checks after a
  # week of runs.
  images:
    name: images
    needs: changes
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'merge_group' &&
          (needs.changes.result != 'success' || needs.changes.outputs.images == 'true')) ||
        ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The env files the compose files load are not in git: the on-premise example stands in
      # for ../.env (it also proves the example is accepted), empty files for the others.
      - name: Check the compose files
        run: |
          cp infra/.env.onprem.example .env
          touch backend/.env.qa frontend/.env.qa backend/.env.prod frontend/.env.prod backend/env.dev
          docker compose -f infra/compose.onprem.yml config -q
          docker compose -f infra/compose.onprem.yml --profile tools config -q
          docker compose -f infra/compose.onprem.yml -f infra/compose.onprem.build.yml config -q
          docker compose --env-file backend/.env.qa -f infra/compose.qa.yml config -q
          docker compose --env-file backend/.env.prod -f infra/compose.prod.yml config -q
          docker compose -f infra/docker-compose.example.yml config -q
      - name: Check the base image pins (multi-architecture index digests)
        run: bash .github/scripts/check-image-pins.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the API image (runtime stage)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          target: runtime
          tags: kanap-api:ci
          load: true
          cache-from: type=gha,scope=api-runtime
          cache-to: ${{ github.event_name != 'merge_group' && 'type=gha,mode=max,scope=api-runtime' || '' }}
      # The same checks run on the published image (release-images.yml).
      - name: Check the API image (converters, no sources or development tools)
        run: bash .github/scripts/check-api-image.sh kanap-api:ci
      - name: Build the API image (dev stage)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          target: dev
          cache-from: |
            type=gha,scope=api-runtime
            type=gha,scope=api-dev
          cache-to: ${{ github.event_name != 'merge_group' && 'type=gha,mode=max,scope=api-dev' || '' }}
      - name: Build the web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          cache-from: type=gha,scope=web
          cache-to: ${{ github.event_name != 'merge_group' && 'type=gha,mode=max,scope=web' || '' }}
      - name: Build the marketing image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: marketing
          cache-from: type=gha,scope=marketing
          cache-to: ${{ github.event_name != 'merge_group' && 'type=gha,mode=max,scope=marketing' || '' }}
