name: Dependabot queue

# Puts the minor and patch Dependabot pull requests in the merge queue by themselves
# (`gh pr merge --auto --squash`, as .github/scripts/queue-stack.sh does by hand). Majors never
# reach this point: .github/dependabot.yml ignores them.
#
# Why a GitHub App: GitHub's "Automating Dependabot with GitHub Actions" says that when the
# target branch uses a merge queue, "the built-in `GITHUB_TOKEN` cannot add pull requests to the
# queue". The org app `kanap-queue` (installed on this repository only, Contents and Pull
# requests in write) gives a short-lived installation token instead. Its client id and private
# key are Dependabot secrets of the repository: a workflow run started by Dependabot only sees
# those. Unlike `GITHUB_TOKEN`, an app installation token triggers workflows, so the merge queue
# still starts the `merge_group` run of CI that tests the pull request.
#
# A pull_request run uses the workflow file of the pull request, so a Dependabot update of the
# actions runs their new versions here before anyone reviews them. Hence two jobs: `metadata`
# runs the action, with a token that only reads and no secret; `queue` holds the private key and
# runs no action, only the shell below and the tools of the runner (openssl, curl, jq, gh).
#
# On failure in the queue (a required check fails, or a conflict with main), the pull request
# leaves the queue and stays open, like any other pull request. An agent finds the cause, fixes
# it apart if needed, and queues it again with queue-stack.sh.
on:
  pull_request:
    branches: [ main ]

# A new push to the pull request (a Dependabot rebase) cancels the run of the previous push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow token only reads; the queueing uses the app token.
permissions:
  contents: read

jobs:
  metadata:
    name: read Dependabot metadata
    # A human or agent push to a Dependabot branch skips both jobs: that run gets no Dependabot
    # secrets and fetch-metadata refuses an actor other than Dependabot.
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      update-type: ${{ steps.metadata.outputs.update-type }}
    steps:
      - name: Read the Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  # update-type is the highest change of the pull request (a grouped pull request included).
  # It is empty when Dependabot reports no semver change, for example an image digest update:
  # such a pull request is not queued and waits for an agent.
  queue:
    name: queue Dependabot pull request
    needs: metadata
    if: >-
      ${{ github.event.pull_request.user.login == 'dependabot[bot]' &&
          github.actor == 'dependabot[bot]' &&
          (needs.metadata.outputs.update-type == 'version-update:semver-minor' ||
            needs.metadata.outputs.update-type == 'version-update:semver-patch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # The workflow token is not used: gh runs with the app token.
    permissions: {}
    steps:
      # The app signs a JWT with its client id as issuer, exchanges it for an installation token
      # limited to this repository, queues the pull request, and revokes the token on exit.
      - name: Put the pull request in the merge queue with the kanap-queue app token
        env:
          APP_CLIENT_ID: ${{ secrets.KANAP_QUEUE_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.KANAP_QUEUE_APP_PRIVATE_KEY }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        shell: bash
        run: |
          set -euo pipefail
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          api() {
            curl -fsS -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }
          now=$(date +%s)
          header=$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)
          payload=$(jq -cn --arg iss "$APP_CLIENT_ID" --argjson now "$now" \
            '{iat: ($now - 60), exp: ($now + 300), iss: $iss}' | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" \
            | openssl dgst -sha256 -binary -sign <(printf '%s\n' "$APP_PRIVATE_KEY") | b64url)
          jwt="$header.$payload.$signature"
          echo "::add-mask::$jwt"
          installation=$(api -H "Authorization: Bearer $jwt" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/installation" | jq -er .id)
          token=$(api -X POST -H "Authorization: Bearer $jwt" \
            -d "$(jq -cn --arg repo "${GITHUB_REPOSITORY#*/}" '{repositories: [$repo]}')" \
            "$GITHUB_API_URL/app/installations/$installation/access_tokens" | jq -er .token)
          echo "::add-mask::$token"
          trap 'api -X DELETE -H "Authorization: Bearer $token" "$GITHUB_API_URL/installation/token" >/dev/null || true' EXIT
          GH_TOKEN=$token gh pr merge --auto --squash "$PR_URL"
