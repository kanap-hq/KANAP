site_name: Kadratis
site_url: https://doc.kadratis.com
site_description: Documentation for Kadratis, the open source IT governance platform - IT budget, application landscape, project portfolio, documentation and the Kad AI agent

repo_url: https://github.com/kanap-hq/KANAP
repo_name: kanap-hq/KANAP

docs_dir: docs

theme:
  name: material
  language: en

  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - toc.follow

  icon:
    repo: fontawesome/brands/github

  # Kadratis symbol for the coloured header, adaptive favicon
  logo: assets/kadratis-symbole-inverse.svg
  favicon: assets/favicon.svg

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://kadratis.com
      name: Kadratis Website

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - i18n:
      docs_structure: folder
      reconfigure_material: true
      reconfigure_search: true
      languages:
