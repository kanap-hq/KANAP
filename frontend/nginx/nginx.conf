# Main configuration of the web image, in place of the one of the nginx base image: the same
# values (worker processes, connections, MIME types, log format, sendfile, keepalive; gzip is set
# in the server block), with everything nginx writes under /tmp/nginx. The container then runs as
# any user, on a read-only root file system with a writable /tmp.
#
# docker-entrypoint.sh writes the two files included from /tmp/nginx before it starts nginx:
# user.conf ("user nginx;" when the container runs as root, empty otherwise) and default.conf
# (the server block, from /etc/nginx/default.conf.template).

include /tmp/nginx/user.conf;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /tmp/nginx/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout  main;

    sendfile        on;

    keepalive_timeout  65;

    # nginx creates these directories at start; as root, it hands them to the worker user.
    client_body_temp_path  /tmp/nginx/client_temp;
    proxy_temp_path        /tmp/nginx/proxy_temp;
    fastcgi_temp_path      /tmp/nginx/fastcgi_temp;
    uwsgi_temp_path        /tmp/nginx/uwsgi_temp;
    scgi_temp_path         /tmp/nginx/scgi_temp;

    include /tmp/nginx/default.conf;
}
