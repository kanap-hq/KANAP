# Response headers of the app's responses, shared by the server level and every location of
# default.conf that serves the app (/api/ passes the API's own headers through). A location that
# declares an add_header of its own stops inheriting the server-level ones, so each of them
# includes this file instead of repeating the lines. "always" puts them on error responses too.
# No Strict-Transport-Security here: some installations serve this container over plain HTTP;
# the TLS proxy in front of it sets that header.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
