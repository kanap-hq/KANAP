# Scheme of the browser's request, passed to the API: the value set by the TLS proxy in front of
# this container when there is one, otherwise the scheme this container was reached with.
map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }

server {
  listen 80;
  server_name _;
  # No nginx version in the Server header and error pages.
  server_tokens off;
  client_max_body_size 20m;
  root /usr/share/nginx/html;
  index index.html;

  # Declared once and repeated in every location that serves the app: a nested add_header
  # replaces the inherited set, so the CSP would silently disappear from that response. The
  # other headers come from security-headers.conf, included in those locations for the same
  # reason (/api/ passes the API's own headers through). __KANAP_API_ORIGIN__ is replaced at
  # image build time (Dockerfile): empty when VITE_API_URL is a path on this site, the API
  # origin when it is an absolute URL, " https:" when the host of that URL cannot be read.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.your-objectstorage.com; connect-src 'self'__KANAP_API_ORIGIN__; font-src 'self' data:; frame-ancestors 'self'; base-uri 'self';";
  add_header Content-Security-Policy $csp always;
  include security-headers.conf;

  # Compress at the origin. Cloudflare compresses on its own when proxying, but on-prem
  # deployments and any direct access to the container get the raw payload otherwise --
  # the entry bundle is ~1.8 MB uncompressed. text/html is always compressed by nginx and
  # is deliberately not listed.
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  # text/javascript as well: the image tag floats, and nginx's mime.types may move .js to it.
  gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json application/xml application/wasm image/svg+xml font/woff2;

  # Proxy API requests to the backend service on the Docker network. The API sets its own
  # security headers (Content-Security-Policy, X-Content-Type-Options, Referrer-Policy,
  # X-Frame-Options, ...), passed through as they are, the same as when /api/ reaches the API
  # directly. nginx adds only Permissions-Policy, which the API does not send. This add_header
  # also keeps the server-level set (the app's CSP, security-headers.conf) off these responses.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Real-IP $remote_addr;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # The SPA shell must never be cached: it is what points at the hashed bundles, so a stale
  # copy keeps loading chunk names that a deploy has already removed.
  location = /index.html {
    add_header Content-Security-Policy $csp always;
    include security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
  }

  # Hashed build output. A missing chunk has to 404 rather than fall back to index.html:
  # answering 200 text/html for /assets/<chunk>.js is cached as immutable and leaves the app
  # parsing HTML as JavaScript after a deploy.
  location ^~ /assets/ {
    add_header Content-Security-Policy $csp always;
    include security-headers.conf;
    # No "always" here: it would stamp the 404 of a missing chunk as immutable for a week,
    # in the browser and at the CDN, and that URL comes back on a rollback.
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Same for the loose asset types served from the root (fonts, svg).
  location ~* \.(?:js|css|woff2?|eot|ttf|otf|svg)$ {
    add_header Content-Security-Policy $csp always;
    include security-headers.conf;
    # No "always" here: it would stamp the 404 of a missing chunk as immutable for a week,
    # in the browser and at the CDN, and that URL comes back on a rollback.
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
    try_files $uri =404;
  }

  # Client-side routes: fall back to the shell.
  location / {
    add_header Content-Security-Policy $csp always;
    include security-headers.conf;
    try_files $uri /index.html;
  }
}
