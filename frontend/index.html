<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PRODUCT_NAME%</title>

    <!-- PWA Configuration -->
    <meta name="theme-color" content="#1A6B7A" />
    <meta name="description" content="%PRODUCT_NAME% - IT Department Management" />
    <!-- Served by the API per workspace: an installed app takes the organisation name. -->
    <link rel="manifest" href="/api/public/manifest.webmanifest" />

    <!-- Icons -->
    <!-- The SVG follows the light or dark theme of the browser; the ICO is the fallback. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Mobile App Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="%PRODUCT_NAME%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
